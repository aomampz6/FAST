<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบคู่มือการตั้งค่า Huawei HG8145V5</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Prevent full body scroll, handle inside containers */
        }

        /* Custom Huawei Blue */
        .huawei-bg { background-color: #38bdf8; }
        .huawei-text { color: #38bdf8; }

        /* Highlight Animation for Manual Instructions */
        .highlight-item {
            position: relative;
            z-index: 10;
            border-radius: 4px;
            outline: 3px solid #ef4444; /* Red outline */
            outline-offset: 2px;
            animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .highlight-text {
            color: #ef4444;
            font-weight: bold;
        }

        @keyframes pulse-ring {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); outline-color: #ef4444; }
            50% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); outline-color: #fca5a5; }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); outline-color: #ef4444; }
        }

        /* Scrollbar styling for a cleaner look */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Mock UI Specific Styles */
        .mock-sidebar-active {
            background-color: #e0f2fe;
            border-left: 4px solid #38bdf8;
            font-weight: bold;
            color: #0369a1;
        }

        .mock-breadcrumb { display: none; }

        /* Mock UI: on narrow screens the desktop-style label + fixed-width field rows
           (e.g. "WAN Mode:" beside a 256px <select>) don't fit and get clipped. Stack
           them vertically instead so every field is fully readable on first load. */
        @media (max-width: 640px) {
            #mock-ui-root .flex.items-center:has(> label[class*="w-1/3"]),
            #mock-ui-root .flex.items-center:has(> label[class*="w-2/5"]) {
                flex-direction: column;
                align-items: flex-start;
            }
            #mock-ui-root .flex.items-center:has(> label[class*="w-1/3"]) > label[class*="w-1/3"],
            #mock-ui-root .flex.items-center:has(> label[class*="w-2/5"]) > label[class*="w-2/5"] {
                width: 100%;
                text-align: left;
                padding-right: 0;
                margin-bottom: 4px;
            }
            #mock-ui-root .flex.items-center:has(> label[class*="w-1/3"]) > select,
            #mock-ui-root .flex.items-center:has(> label[class*="w-1/3"]) > input,
            #mock-ui-root .flex.items-center:has(> label[class*="w-1/3"]) > div,
            #mock-ui-root .flex.items-center:has(> label[class*="w-2/5"]) > select,
            #mock-ui-root .flex.items-center:has(> label[class*="w-2/5"]) > input,
            #mock-ui-root .flex.items-center:has(> label[class*="w-2/5"]) > div {
                width: 100%;
            }
            #mock-ui-root .grid.grid-cols-2 {
                grid-template-columns: 1fr;
            }
            /* The left icon-bar + text menu together eat ~280px, leaving almost nothing
               for the actual form content. Hide them on mobile; the step instruction
               above the mock UI already tells the user which menu to go to. */
            .mock-icon-bar, .mock-text-menu {
                display: none !important;
            }
            .mock-breadcrumb {
                display: flex;
            }
        }

        /* Mobile sidebar drawer */
        @media (max-width: 767px) {
            #sidebar {
                position: fixed;
                top: 0;
                left: 0;
                height: 100%;
                width: 85vw;
                max-width: 320px;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
            }
            #sidebar.open { transform: translateX(0); }
            #sidebar-backdrop.open { display: block; }
        }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-blue-800 text-white shadow-md z-20 flex-shrink-0">
        <div class="px-3 sm:px-6 py-3 sm:py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2 sm:space-x-3 min-w-0">
                <button id="btn-sidebar-toggle" class="md:hidden text-blue-200 hover:text-white p-1 -ml-1 flex-shrink-0" aria-label="เปิดสารบัญ">
                    <i class="fas fa-bars text-lg"></i>
                </button>
                <i class="fas fa-book-open text-xl sm:text-2xl text-blue-300 flex-shrink-0"></i>
                <h1 class="text-sm sm:text-xl font-bold tracking-wide truncate">ระบบคู่มือการตั้งค่า Huawei HG8145V5</h1>
            </div>
            <div class="text-blue-200 text-xs sm:text-sm hidden sm:block flex-shrink-0">
                Interactive Configuration Guide
            </div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">

        <!-- Backdrop for mobile sidebar drawer -->
        <div id="sidebar-backdrop" class="hidden fixed inset-0 bg-black/40 z-20 md:!hidden" onclick="closeSidebar()"></div>

        <!-- Sidebar: Table of Contents -->
        <aside id="sidebar" class="w-80 bg-white border-r shadow-lg flex flex-col z-30 flex-shrink-0">
            <div class="p-4 bg-gray-50 border-b flex items-center justify-between">
                <h2 class="font-semibold text-gray-700"><i class="fas fa-list-ul mr-2"></i> สารบัญขั้นตอน</h2>
                <button onclick="closeSidebar()" class="md:hidden text-gray-400 hover:text-gray-600 p-1"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto" id="sidebar-menu">
                <!-- Menu items injected via JS -->
            </div>
        </aside>

        <!-- Main Content Area: Instructions & Mock UI -->
        <main class="flex-1 flex flex-col min-w-0 bg-gray-100 relative">

            <!-- Instruction Panel -->
            <div class="bg-white shadow-sm border-b border-gray-200 z-10 flex-shrink-0">
                <div class="max-w-5xl mx-auto px-4 sm:px-8 py-3 sm:py-6">
                    <div class="flex justify-between items-start mb-2 sm:mb-4 gap-2">
                        <h2 id="step-title" class="text-base sm:text-2xl font-bold text-blue-700">ชื่อขั้นตอน</h2>
                        <span id="step-counter" class="bg-blue-100 text-blue-800 text-[10px] sm:text-xs font-semibold px-2 sm:px-3 py-1 rounded-full whitespace-nowrap">Step 1 of 12</span>
                    </div>
                    <div id="step-instruction" class="text-gray-700 text-sm sm:text-lg leading-relaxed mb-3 sm:mb-6 min-h-0 sm:min-h-[4rem] max-h-24 sm:max-h-none overflow-y-auto sm:overflow-visible">
                        <!-- Instruction text injected here -->
                    </div>

                    <!-- Navigation Buttons -->
                    <div class="flex justify-between items-center pt-3 sm:pt-4 border-t border-gray-100">
                        <button id="btn-prev" onclick="prevStep()" class="px-3 sm:px-5 py-2 rounded bg-gray-100 text-gray-700 hover:bg-gray-200 font-medium transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center text-sm sm:text-base">
                            <i class="fas fa-chevron-left mr-1 sm:mr-2"></i> ก่อนหน้า
                        </button>
                        <button id="btn-next" onclick="nextStep()" class="px-3 sm:px-5 py-2 rounded bg-blue-600 text-white hover:bg-blue-700 font-medium transition-colors shadow-sm flex items-center text-sm sm:text-base">
                            ถัดไป <i class="fas fa-chevron-right ml-1 sm:ml-2"></i>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Mock UI Container -->
            <div class="flex-1 overflow-y-auto p-2 sm:p-8 flex justify-center bg-[#e5e7eb]">
                <div class="w-full max-w-5xl">
                    <!-- Browser-like window wrapper -->
                    <div class="bg-white rounded-lg shadow-xl overflow-hidden border border-gray-300 flex flex-col h-full min-h-[420px] sm:min-h-[600px]">
                        <!-- Browser Header -->
                        <div class="bg-gray-200 px-2 sm:px-4 py-2 border-b border-gray-300 flex items-center space-x-2">
                            <div class="flex space-x-1.5 flex-shrink-0">
                                <div class="w-3 h-3 rounded-full bg-red-400"></div>
                                <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                                <div class="w-3 h-3 rounded-full bg-green-400"></div>
                            </div>
                            <div class="ml-2 sm:ml-4 bg-white px-2 sm:px-3 py-0.5 rounded text-[10px] sm:text-xs text-gray-500 flex-1 font-mono text-center border border-gray-300 shadow-inner truncate">
                                <i class="fas fa-lock text-green-600 mr-1"></i> http://192.168.1.1
                            </div>
                            <div class="text-[10px] sm:text-xs text-gray-400 font-semibold px-1 sm:px-2 hidden sm:block">หน้าจอจำลอง (Mock UI)</div>
                        </div>

                        <!-- Actual Mock UI Content -->
                        <div id="mock-ui-root" class="flex-1 relative overflow-auto bg-white text-[13px] sm:text-base">
                            <!-- UI injected here -->
                        </div>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <script>
        // --- Data Definitions ---
        const manualSteps = [
            {
                id: 'login',
                title: '1. การเข้าสู่ระบบ (Login)',
                instruction: 'เปิดเว็บเบราว์เซอร์ พิมพ์ที่อยู่ IP ของเร้าเตอร์ (ค่าเริ่มต้นคือ <b>192.168.1.1</b>)<br>จากนั้นกรอกข้อมูลเพื่อเข้าสู่ระบบ:<br><ul class="list-disc pl-6 mt-2 text-base"><li><b>User Name:</b> <code class="bg-gray-100 px-1 rounded text-red-600">telecomadmin</code></li><li><b>Password:</b> <code class="bg-gray-100 px-1 rounded text-red-600">admintelecom</code></li></ul><p class="mt-2 text-sm text-gray-500"><i class="fas fa-info-circle"></i> บัญชี telecomadmin เป็นบัญชีสิทธิ์ระดับสูงสำหรับการตั้งค่าเชิงลึก</p>',
                renderUI: renderLoginMock
            },
            {
                id: 'provisioning',
                title: '2. เลือกวิธี Service Provisioning',
                instruction: 'เมื่อเข้าสู่ระบบครั้งแรก หรือหลังจากรีเซ็ตค่า อาจพบหน้าต่างนี้<br>ให้ติ๊กเลือก <b class="text-blue-700">On the ONT web page</b> เพื่อระบุว่าเราจะตั้งค่าเร้าเตอร์ด้วยตัวเองผ่านหน้าเว็บนี้ จากนั้นคลิก <b>Next</b>',
                renderUI: renderProvisioningMock
            },
            {
                id: 'lan',
                title: '3. การตั้งค่าเปิดพอร์ต LAN',
                instruction: 'ไปที่เมนู <b>LAN > Layer 2/3 Port</b><br>ทำการ <b class="highlight-text">ติ๊กถูกที่ช่อง LAN1, LAN2, LAN3 และ LAN4</b> เพื่อเปิดให้สามารถใช้งานพอร์ต LAN ด้านหลังเร้าเตอร์ได้ครบทุกช่อง จากนั้นคลิกปุ่ม <b>Apply</b>',
                renderUI: () => renderDashboardShell('LAN', 'Layer 2/3 Port', renderStep3Content())
            },
            {
                id: 'wan',
                title: '4. การตั้งค่าการเชื่อมต่ออินเทอร์เน็ต (WAN)',
                instruction: 'ไปที่เมนู <b>WAN</b> เพื่อตั้งค่าโปรไฟล์อินเทอร์เน็ต<br><ul class="list-disc pl-6 mt-2 text-base"><li>เลือกโปรไฟล์ที่มีชื่อ <b>TR069_INTERNET</b></li><li>ตรวจสอบ <b>VLAN ID</b> (มักจะได้จากผู้ให้บริการ)</li><li>ที่หัวข้อ <b>Binding Options</b> ให้ติ๊กเลือกพอร์ต LAN และ SSID (Wi-Fi) ที่ต้องการให้สามารถเล่นอินเทอร์เน็ตได้</li></ul>คลิก <b>Apply</b> เมื่อเสร็จสิ้น',
                renderUI: () => renderDashboardShell('WAN', '', renderStep4Content())
            },
            {
                 id: 'security_fw',
                 title: '5. การตั้งค่าความปลอดภัย (Firewall)',
                 instruction: 'ไปที่เมนู <b>Security > IPv4 Firewall Level</b><br>แนะนำให้เลือกระดับ <b class="highlight-text">Standard</b> ซึ่งเป็นการป้องกันพื้นฐานที่เพียงพอและไม่รบกวนการใช้งานทั่วไป เช่น การเล่นเกม หรือการ Forward Port',
                 renderUI: () => renderDashboardShell('Security', 'Firewall Level', renderStep6Content())
            },
            {
                 id: 'security_dos',
                 title: '6. การป้องกันการโจมตี (DoS Configuration)',
                 instruction: 'ไปที่เมนู <b>Security > DoS Configuration</b><br>ติ๊กเลือกหัวข้อต่างๆ เพื่อให้เร้าเตอร์ช่วยกรองการโจมตีทางเครือข่ายเบื้องต้น เช่น <b class="highlight-text">Prevent SYN Flood</b> หรือ <b class="highlight-text">Prevent LAND Attack</b>',
                 renderUI: () => renderDashboardShell('Security', 'DoS Configuration', renderStep7Content())
            },
            {
                 id: 'security_access',
                 title: '7. การควบคุมการเข้าถึงอุปกรณ์',
                 instruction: 'ไปที่เมนู <b>Security > Precise Device Access Control</b><br>หากต้องการเปิด/ปิดการเข้าถึงเซอร์วิสบางอย่างจากภายนอก (WAN) เช่น อนุญาตให้ปิงมาเจอ (ICMP) ให้สร้างกฏ (Rule) ใหม่ เลือก Application เป็น <b class="highlight-text">ICMP</b> และเลือก Mode เป็น <b class="highlight-text">Permit</b>',
                 renderUI: () => renderDashboardShell('Security', 'Precise Device Access Control', renderStep8Content())
            },
            {
                 id: 'app_time',
                 title: '8. การตั้งเวลาเร้าเตอร์ (Time Setting)',
                 instruction: 'ไปที่เมนู <b>Application > Time Setting</b><br>ระบบเวลาที่ถูกต้องจำเป็นต่อการบันทึก Log และการเชื่อมต่อบางประเภท<br>ให้ตั้งค่า <b>Time Zone</b> เป็น <b class="highlight-text">GMT+07:00 (Bangkok...)</b> และเลือก WAN Name เป็นโปรไฟล์อินเทอร์เน็ต',
                 renderUI: () => renderDashboardShell('Application', 'Time Setting', renderStep9Content())
            },
            {
                 id: 'app_upnp',
                 title: '9. การเปิดใช้งานฟังก์ชัน UPnP',
                 instruction: 'ไปที่เมนู <b>Application > UPnP</b><br>ติ๊กเลือก <b class="highlight-text">Enable UPnP</b> ฟังก์ชันนี้จะช่วยให้อุปกรณ์ในบ้าน (เช่น เครื่องเกมคอนโซล, กล้องวงจรปิด) สามารถเปิดพอร์ต (Forward Port) ชั่วคราวได้อัตโนมัติ ช่วยลดปัญหา NAT Type Strict',
                 renderUI: () => renderDashboardShell('Application', 'UPnP', renderStep10Content())
            },
            {
                 id: 'wlan',
                 title: '10. การตั้งค่าชื่อและรหัสผ่าน Wi-Fi',
                 instruction: 'ไปที่เมนู <b>WLAN > 2.4G Basic Network Settings</b> (หรือ 5G)<br><ul class="list-disc pl-6 mt-2 text-base"><li><b>SSID Name:</b> พิมพ์ชื่อ Wi-Fi ที่ต้องการให้แสดง</li><li><b>Authentication Mode:</b> เลือก <b class="highlight-text">WPA2 PreSharedKey</b></li><li><b>WPA PreSharedKey:</b> พิมพ์รหัสผ่าน Wi-Fi (อย่างน้อย 8 ตัวอักษร)</li></ul>คลิก Apply',
                 renderUI: () => renderDashboardShell('WLAN', '2.4G Basic Network Settings', renderStep11Content())
            },
            {
                 id: 'voice',
                 title: '11. การตั้งค่าโทรศัพท์บ้าน (VoIP)',
                 instruction: 'ไปที่เมนู <b>Voice > VoIP Basic</b><br>กรอกข้อมูล <b>Primary Proxy Server</b> ตามที่ผู้ให้บริการกำหนด (เช่น sipn20.totbb.net)<br>สำคัญ: ต้องเลือก <b>Signaling Port</b> และ <b>Media Port</b> ให้ชี้ไปยัง <b class="highlight-text">โปรไฟล์ WAN สำหรับ VoIP</b> ที่สร้างไว้',
                 renderUI: () => renderDashboardShell('Voice', 'VoIP Basic', renderStep12Content())
            },
            {
                 id: 'maintenance',
                 title: '12. การบันทึกการตั้งค่า (Save)',
                 instruction: 'ขั้นตอนสุดท้ายที่สำคัญมาก! ไปที่เมนู <b>Maintenance Diagnosis > Configuration File Management</b><br>คลิกปุ่ม <b class="highlight-text px-2 py-1 bg-gray-100 rounded">Save</b> เพื่อทำการบันทึกการตั้งค่าทั้งหมดลงในหน่วยความจำถาวร หากไม่กดปุ่มนี้ เมื่อเร้าเตอร์รีบูตหรือไฟดับ การตั้งค่าทั้งหมดจะหายไป',
                 renderUI: () => renderDashboardShell('Maintenance Diagnosis', 'Configuration File Management', renderStep13Content())
            }
        ];

        let currentStepIndex = 0;

        // --- Core Functions ---

        function initApp() {
            renderSidebarMenu();
            updateView();

            const toggleBtn = document.getElementById('btn-sidebar-toggle');
            if (toggleBtn) toggleBtn.addEventListener('click', openSidebar);
        }

        function openSidebar() {
            document.getElementById('sidebar').classList.add('open');
            document.getElementById('sidebar-backdrop').classList.remove('hidden');
            document.getElementById('sidebar-backdrop').classList.add('open');
        }

        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('sidebar-backdrop').classList.add('hidden');
            document.getElementById('sidebar-backdrop').classList.remove('open');
        }

        function renderSidebarMenu() {
            const menuContainer = document.getElementById('sidebar-menu');
            let html = '<ul class="py-2">';

            manualSteps.forEach((step, index) => {
                html += `
                    <li>
                        <button onclick="goToStep(${index})" id="nav-item-${index}" class="w-full text-left px-6 py-3 border-l-4 border-transparent hover:bg-gray-50 transition-colors flex items-center text-sm">
                            <span class="w-6 h-6 rounded-full flex items-center justify-center text-xs mr-3 ${index === 0 ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-600'} btn-step-badge">${index + 1}</span>
                            <span class="text-gray-700 btn-step-text font-medium truncate">${step.title.split('. ')[1]}</span>
                        </button>
                    </li>
                `;
            });

            html += '</ul>';
            menuContainer.innerHTML = html;
        }

        function updateView() {
            const step = manualSteps[currentStepIndex];

            // Update Text content
            document.getElementById('step-title').innerText = step.title;
            document.getElementById('step-instruction').innerHTML = step.instruction;
            document.getElementById('step-counter').innerText = `Step ${currentStepIndex + 1} of ${manualSteps.length}`;

            // Update Mock UI
            document.getElementById('mock-ui-root').innerHTML = step.renderUI();

            // Update Buttons State
            document.getElementById('btn-prev').disabled = currentStepIndex === 0;
            document.getElementById('btn-next').disabled = currentStepIndex === manualSteps.length - 1;

            // Change Next button text on last step
            if (currentStepIndex === manualSteps.length - 1) {
                document.getElementById('btn-next').innerHTML = 'สิ้นสุด <i class="fas fa-check ml-2"></i>';
                document.getElementById('btn-next').classList.replace('bg-blue-600', 'bg-green-600');
                document.getElementById('btn-next').classList.replace('hover:bg-blue-700', 'hover:bg-green-700');
            } else {
                document.getElementById('btn-next').innerHTML = 'ถัดไป <i class="fas fa-chevron-right ml-2"></i>';
                document.getElementById('btn-next').classList.replace('bg-green-600', 'bg-blue-600');
                document.getElementById('btn-next').classList.replace('hover:bg-green-700', 'hover:bg-blue-700');
            }

            // Update Sidebar Highlighting
            manualSteps.forEach((_, idx) => {
                const navItem = document.getElementById(`nav-item-${idx}`);
                const badge = navItem.querySelector('.btn-step-badge');
                const text = navItem.querySelector('.btn-step-text');

                if (idx === currentStepIndex) {
                    navItem.classList.add('bg-blue-50', 'border-blue-600');
                    navItem.classList.remove('border-transparent', 'hover:bg-gray-50');
                    badge.classList.add('bg-blue-600', 'text-white');
                    badge.classList.remove('bg-gray-200', 'text-gray-600', 'bg-green-500');
                    text.classList.add('text-blue-700', 'font-bold');
                    text.classList.remove('text-gray-700', 'font-medium');
                } else if (idx < currentStepIndex) {
                     // Completed steps
                    navItem.classList.remove('bg-blue-50', 'border-blue-600');
                    navItem.classList.add('border-transparent', 'hover:bg-gray-50');
                    badge.classList.remove('bg-blue-600', 'bg-gray-200', 'text-gray-600');
                    badge.classList.add('bg-green-500', 'text-white');
                    badge.innerHTML = '<i class="fas fa-check"></i>'; // Change number to checkmark
                    text.classList.remove('text-blue-700', 'font-bold');
                    text.classList.add('text-gray-700', 'font-medium');
                } else {
                    // Future steps
                    navItem.classList.remove('bg-blue-50', 'border-blue-600');
                    navItem.classList.add('border-transparent', 'hover:bg-gray-50');
                    badge.classList.remove('bg-blue-600', 'text-white', 'bg-green-500');
                    badge.classList.add('bg-gray-200', 'text-gray-600');
                    badge.innerText = idx + 1; // Restore number
                    text.classList.remove('text-blue-700', 'font-bold');
                    text.classList.add('text-gray-700', 'font-medium');
                }
            });

            // Scroll sidebar if needed
            const activeNav = document.getElementById(`nav-item-${currentStepIndex}`);
            if (activeNav) {
                activeNav.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }
        }

        function nextStep() {
            if (currentStepIndex < manualSteps.length - 1) {
                currentStepIndex++;
                updateView();
            }
        }

        function prevStep() {
            if (currentStepIndex > 0) {
                currentStepIndex--;
                updateView();
            }
        }

        function goToStep(index) {
            currentStepIndex = index;
            updateView();
            if (window.innerWidth < 768) closeSidebar();
        }
