services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: ${PORT:-10300}
      MONGODB_URI: ${MONGODB_URI:?MongoDB SRV connection string is required}
      JWT_SECRET: ${JWT_SECRET:?JWT secret is required}
      ADMIN_USER: ${ADMIN_USER:?Admin username is required}
      ADMIN_PASS: ${ADMIN_PASS:?Admin password is required}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_BUCKET: ${S3_BUCKET:-}
      SERVICE_FQDN_FAST_10300: ${SERVICE_FQDN_FAST_10300:-}
    ports:
      - "${PORT:-10300}:${PORT:-10300}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:${PORT:-10300}/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
