services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: ${PORT:-10300}
      MONGODB_URI: ${MONGODB_URI:?MongoDB SRV connection string is required}
      JWT_SECRET: ${SERVICE_HEX_64_JWT:?JWT secret is required}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASS: ${SERVICE_PASSWORD_ADMIN:?Admin password is required}
      SERVICE_FQDN_FAST_10300: ${SERVICE_FQDN_FAST_10300:-}
    ports:
      - "${PORT:-10300}:${PORT:-10300}"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:${PORT:-10300}/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped
